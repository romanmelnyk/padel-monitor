name: booking-test

# Ручні дії з бронями. Лише запуск кнопкою Run workflow.
#  book - справжня бронь вказаного слоту (twojtenis)
#  ics  - додати вже наявну бронь у календар
#  cash - обрати оплату готівкою для ваших майбутніх броней tenis4u «до оплати» (поля корт/дата/час не потрібні)
on:
  workflow_dispatch:
    inputs:
      action:
        description: "book = забронювати (справжня бронь!); ics = додати наявну бронь у календар; cash = готівка для броней tenis4u «до оплати»"
        type: choice
        options: ["ics", "book", "cash"]
        default: "ics"
      source:
        description: "Клуб (short з config.json)"
        default: "Błonia"
      court:
        description: "Корт, напр. Padel 3 (для book/ics)"
        required: false
        default: ""
      day:
        description: "Дата YYYY-MM-DD (для book/ics)"
        required: false
        default: ""
      start:
        description: "Початок HH:MM (для book/ics)"
        required: false
        default: ""
      end:
        description: "Кінець HH:MM (для book/ics)"
        required: false
        default: ""
      booking_id:
        description: "Для ics: id броні (необов'язково)"
        required: false
        default: ""

permissions:
  contents: read

jobs:
  book:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install browser for twojtenis login
        if: inputs.action == 'book'
        run: |
          pip install -q playwright
          python -m playwright install --with-deps chromium > /dev/null
      - name: Run
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TENIS4U_LOGIN: ${{ secrets.TENIS4U_LOGIN }}
          TENIS4U_PASSWORD: ${{ secrets.TENIS4U_PASSWORD }}
          TWOJTENIS_LOGIN: ${{ secrets.TWOJTENIS_LOGIN }}
          TWOJTENIS_PASSWORD: ${{ secrets.TWOJTENIS_PASSWORD }}
          ICLOUD_USER: ${{ secrets.ICLOUD_USER }}
          ICLOUD_APP_PASSWORD: ${{ secrets.ICLOUD_APP_PASSWORD }}
          ICLOUD_CALENDAR: ${{ secrets.ICLOUD_CALENDAR }}
        run: python booker.py "${{ inputs.action }}" "${{ inputs.source }}" "${{ inputs.court }}" "${{ inputs.day }}" "${{ inputs.start }}" "${{ inputs.end }}" "${{ inputs.booking_id }}"
