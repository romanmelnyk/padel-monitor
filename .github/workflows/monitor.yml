name: padel-monitor

# Один запуск працює ~5.5 год і перевіряє клуби кожні POLL_SECONDS секунд.
# Розклад щогодини лише "підстраховує": поки йде запуск, наступний чекає в черзі
# і стартує одразу після нього, тож перевірки йдуть майже без перерв.
on:
  schedule:
    - cron: "7 * * * *"
  workflow_dispatch: {}

permissions:
  contents: write
  actions: write   # щоб запуск міг сам стартувати наступний

concurrency:
  group: padel-monitor
  cancel-in-progress: false

env:
  POLL_SECONDS: "1800"      # інтервал між перевірками (30 хв); додатково завжди о 00:01 за Варшавою
  RUN_MINUTES: "300"        # скільки працює один запуск; біля опівночі подовжується, щоб не було паузи
  COMMIT_EVERY_SECONDS: "600"  # комітити журнали не частіше ніж раз на 10 хв

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 355
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # стан (які слоти вільні зараз) живе в кеші, а не в git, щоб репозиторій не роздувався
      - name: Restore state
        uses: actions/cache/restore@v4
        with:
          path: data/state.json
          key: state-${{ github.run_id }}
          restore-keys: state-

      - name: Poll loop
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TENIS4U_LOGIN: ${{ secrets.TENIS4U_LOGIN }}
          TENIS4U_PASSWORD: ${{ secrets.TENIS4U_PASSWORD }}
        run: |
          git config user.name "padel-monitor"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          commit_data() {
            python analyze.py || echo "analyze failed"
            git add -A data reports
            if git diff --cached --quiet; then return 0; fi
            git commit -q -m "data $(date -u +%Y-%m-%dT%H:%MZ)"
            # підтягуємо зміни коду/налаштувань: наступна перевірка вже йде з новою версією
            git pull -q --rebase || { git rebase --abort; echo "pull failed"; return 0; }
            git push -q || echo "push failed"
          }

          # хвилини від півночі за варшавським часом
          wmin() { local hm; hm=$(TZ=Europe/Warsaw date +%H%M); echo $(( 10#${hm:0:2} * 60 + 10#${hm:2:2} )); }
          # 23:45-00:20: не завершуємо запуск, щоб перевірка о 00:01 точно відбулась
          near_midnight() { local m; m=$(wmin); [ "$m" -ge 1425 ] || [ "$m" -lt 20 ]; }
          # секунд до 00:01:00 за Варшавою: о цій порі відкриваються нові дні, перевіряємо точно в цей момент
          to_midnight() {
            local hms s d; hms=$(TZ=Europe/Warsaw date +%H%M%S)
            s=$(( 10#${hms:0:2} * 3600 + 10#${hms:2:2} * 60 + 10#${hms:4:2} ))
            d=$(( 60 - s )); [ "$d" -le 0 ] && d=$(( d + 86400 )); echo "$d"
          }

          end=$(( $(date +%s) + RUN_MINUTES * 60 ))
          last_commit=$(date +%s)
          while [ "$(date +%s)" -lt "$end" ] || near_midnight; do
            started=$(date +%s)
            python collector.py || echo "collector failed"
            if [ $(( started - last_commit )) -ge "$COMMIT_EVERY_SECONDS" ]; then
              commit_data; last_commit=$(date +%s)
            fi
            sleep_for=$(( POLL_SECONDS - ($(date +%s) - started) ))
            tm=$(to_midnight)
            if [ "$tm" -lt "$sleep_for" ]; then sleep_for=$tm; fi
            if [ "$sleep_for" -gt 0 ]; then
              # між перевірками слухаємо кнопки Telegram (Забронювати / Пропустити / Скасувати)
              wake=$(( $(date +%s) + sleep_for ))
              timeout $(( sleep_for + 120 )) python booker.py poll "$sleep_for" || echo "poll failed"
              rest=$(( wake - $(date +%s) )); if [ "$rest" -gt 0 ]; then sleep "$rest"; fi
            fi
          done
          commit_data

      - name: Save state
        if: always()
        uses: actions/cache/save@v4
        with:
          path: data/state.json
          key: state-${{ github.run_id }}

      # розклад GitHub ненадійний (вночі була пауза 73 хв), тож наступний запуск ставимо в чергу самі.
      # Не спрацьовує, якщо запуск скасували вручну.
      - name: Queue next run
        if: success() || failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run monitor.yml --ref main || echo "could not queue next run"
